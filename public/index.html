<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EvoTSP — evolving the shortest route</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0b1b2b;
    --bg-grid:   rgba(76, 201, 176, 0.06);
    --panel:     #11263d;
    --panel-2:   #0f2135;
    --hairline:  rgba(138, 160, 184, 0.18);
    --ink:       #e9f1f9;
    --muted:     #8aa0b8;
    --route:     #f4a259;  /* the evolving best tour — the hero */
    --route-dim: rgba(244, 162, 89, 0.22);
    --city:      #4cc9b0;  /* the inputs the user places */
    --city-core: #0b1b2b;
    --focus:     #7fd9ff;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 78% -10%, #163150 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .wrap {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 22px;
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 40px;
    min-height: 100%;
  }

  /* ---------- Control rail ---------- */
  .rail { display: flex; flex-direction: column; gap: 18px; }

  .brand h1 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  .brand h1 .evo { color: var(--route); }
  .brand p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 30ch; }

  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 16px 16px 18px;
  }
  .card h2 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .control { margin-bottom: 14px; }
  .control:last-child { margin-bottom: 0; }
  .control label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .control label .name { color: var(--muted); font-size: 13px; }
  .control label .val {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px; color: var(--ink);
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 4px;
    background: var(--hairline); outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--city); border: 3px solid var(--panel);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--city); border: 3px solid var(--panel);
  }
  input:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .btn-row { display: flex; gap: 8px; }
  button {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13.5px; font-weight: 500;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    flex: 1;
  }
  button:hover { border-color: var(--city); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.primary {
    background: var(--route);
    color: #241304;
    border-color: var(--route);
    font-weight: 600;
  }
  button.primary:hover { background: #ffb36b; }
  button:disabled { opacity: .5; cursor: not-allowed; border-color: var(--hairline); }

  /* ---------- Readouts ---------- */
  .readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .readout .k { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .readout .v {
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px; font-weight: 500; color: var(--ink);
    letter-spacing: -0.01em;
  }
  .readout .v.accent { color: var(--route); }

  #plot { width: 100%; height: 96px; display: block; margin-top: 4px; }

  /* ---------- Stage ---------- */
  .stage { display: flex; flex-direction: column; gap: 12px; }
  .stage-frame {
    position: relative;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    overflow: hidden;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 28px,
      var(--panel-2);
    aspect-ratio: 16 / 11;
  }
  #board { width: 100%; height: 100%; display: block; cursor: crosshair; }

  .hint {
    position: absolute; inset: auto 0 0 0;
    padding: 10px 14px;
    color: var(--muted); font-size: 13px;
    background: linear-gradient(0deg, rgba(11,27,43,.85), transparent);
    pointer-events: none;
  }
  .legend { display: flex; gap: 18px; color: var(--muted); font-size: 12.5px; padding: 0 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.city  { background: var(--city); }
  .dot.route { background: var(--route); }

  .error { color: #ff9a8a; font-size: 13px; min-height: 18px; }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; padding: 18px 14px 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <section class="rail">
      <div class="brand">
        <h1><span class="evo">Evo</span>TSP</h1>
        <p>Place cities on the map and evolve the shortest round trip that visits them all.</p>
      </div>

      <div class="card">
        <h2>The map</h2>
        <div class="btn-row" style="margin-bottom:12px;">
          <button id="randomBtn">Scatter 12</button>
          <button id="clearBtn">Clear</button>
        </div>
        <button id="solveBtn" class="primary" style="width:100%;">Evolve route</button>
        <p class="error" id="error"></p>
      </div>

      <div class="card">
        <h2>Algorithm</h2>
        <div class="control">
          <label><span class="name">Population</span><span class="val" id="popVal">200</span></label>
          <input type="range" id="pop" min="40" max="600" step="20" value="200" />
        </div>
        <div class="control">
          <label><span class="name">Generations</span><span class="val" id="genVal">400</span></label>
          <input type="range" id="gen" min="50" max="1500" step="50" value="400" />
        </div>
        <div class="control">
          <label><span class="name">Mutation rate</span><span class="val" id="mutVal">0.15</span></label>
          <input type="range" id="mut" min="0" max="0.6" step="0.01" value="0.15" />
        </div>
      </div>

      <div class="card">
        <h2>Telemetry</h2>
        <div class="readouts">
          <div class="readout"><div class="k">Best distance</div><div class="v accent" id="distOut">—</div></div>
          <div class="readout"><div class="k">Generation</div><div class="v" id="genOut">—</div></div>
        </div>
        <canvas id="plot"></canvas>
      </div>
    </section>

    <section class="stage">
      <div class="stage-frame">
        <canvas id="board"></canvas>
        <div class="hint" id="hint">Click to drop a city, or scatter a batch.</div>
      </div>
      <div class="legend">
        <span><i class="dot city"></i> City you placed</span>
        <span><i class="dot route"></i> Best route found</span>
      </div>
    </section>
  </main>

<script>
(() => {
  const board = document.getElementById("board");
  const plot  = document.getElementById("plot");
  const bctx  = board.getContext("2d");
  const pctx  = plot.getContext("2d");
  const css   = getComputedStyle(document.documentElement);
  const COL   = {
    city:  css.getPropertyValue("--city").trim(),
    core:  css.getPropertyValue("--city-core").trim(),
    route: css.getPropertyValue("--route").trim(),
    dim:   css.getPropertyValue("--route-dim").trim(),
    muted: css.getPropertyValue("--muted").trim(),
    hair:  css.getPropertyValue("--hairline").trim(),
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let cities = [];      // {x, y} in CSS pixels
  let bestTour = null;  // array of indices to draw
  let solving = false;

  // --- High-DPI canvas sizing ---
  function fit(canvas, ctx) {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(r.width  * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return r;
  }

  function drawBoard() {
    const r = fit(board, bctx);
    bctx.clearRect(0, 0, r.width, r.height);

    // Route first, so cities sit on top.
    if (bestTour && cities.length > 1) {
      bctx.lineJoin = "round";
      bctx.lineWidth = 2;
      bctx.strokeStyle = COL.route;
      bctx.shadowColor = COL.route;
      bctx.shadowBlur = 10;
      bctx.beginPath();
      bestTour.forEach((idx, i) => {
        const c = cities[idx];
        i === 0 ? bctx.moveTo(c.x, c.y) : bctx.lineTo(c.x, c.y);
      });
      const first = cities[bestTour[0]];
      bctx.lineTo(first.x, first.y);
      bctx.stroke();
      bctx.shadowBlur = 0;
    }

    cities.forEach((c, i) => {
      bctx.beginPath();
      bctx.fillStyle = COL.city;
      bctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
      bctx.fill();
      bctx.beginPath();
      bctx.fillStyle = COL.core;
      bctx.arc(c.x, c.y, 2.3, 0, Math.PI * 2);
      bctx.fill();
    });
  }

  function drawPlot(history, upTo) {
    const r = fit(plot, pctx);
    pctx.clearRect(0, 0, r.width, r.height);
    if (!history || history.length < 2) return;
    const n = upTo ?? history.length;
    const slice = history.slice(0, n);
    const max = Math.max(...history), min = Math.min(...history);
    const span = Math.max(1e-6, max - min);
    const pad = 8;
    const W = r.width - pad * 2, H = r.height - pad * 2;

    pctx.strokeStyle = COL.hair;
    pctx.lineWidth = 1;
    pctx.beginPath(); pctx.moveTo(pad, pad); pctx.lineTo(pad, pad + H); pctx.stroke();

    pctx.strokeStyle = COL.city;
    pctx.lineWidth = 1.8;
    pctx.beginPath();
    slice.forEach((d, i) => {
      const x = pad + (i / (history.length - 1)) * W;
      const y = pad + (1 - (d - min) / span) * H;
      i === 0 ? pctx.moveTo(x, y) : pctx.lineTo(x, y);
    });
    pctx.stroke();
  }

  // --- Interaction ---
  board.addEventListener("click", (e) => {
    if (solving) return;
    const r = board.getBoundingClientRect();
    cities.push({ x: e.clientX - r.left, y: e.clientY - r.top });
    bestTour = null;
    hideError();
    drawBoard();
  });

  document.getElementById("randomBtn").addEventListener("click", () => {
    if (solving) return;
    const r = board.getBoundingClientRect();
    const m = 36;
    for (let i = 0; i < 12; i++) {
      cities.push({ x: m + Math.random() * (r.width - 2 * m),
                    y: m + Math.random() * (r.height - 2 * m) });
    }
    bestTour = null; hideError(); drawBoard();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    if (solving) return;
    cities = []; bestTour = null; hideError();
    document.getElementById("distOut").textContent = "—";
    document.getElementById("genOut").textContent = "—";
    drawBoard(); drawPlot(null);
  });

  // Live slider labels
  const bind = (id, out, fmt = (v) => v) => {
    const el = document.getElementById(id), o = document.getElementById(out);
    el.addEventListener("input", () => o.textContent = fmt(el.value));
  };
  bind("pop", "popVal");
  bind("gen", "genVal");
  bind("mut", "mutVal", (v) => Number(v).toFixed(2));

  function showError(msg) { document.getElementById("error").textContent = msg; }
  function hideError() { document.getElementById("error").textContent = ""; }

  // --- Solve ---
  document.getElementById("solveBtn").addEventListener("click", async () => {
    if (solving) return;
    if (cities.length < 3) { showError("Place at least 3 cities first."); return; }
    hideError();
    solving = true;
    const solveBtn = document.getElementById("solveBtn");
    solveBtn.disabled = true;
    solveBtn.textContent = "Evolving…";
    document.getElementById("hint").textContent = "Running the genetic algorithm…";

    try {
      const res = await fetch("/solve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          cities,
          population:   Number(document.getElementById("pop").value),
          generations:  Number(document.getElementById("gen").value),
          mutationRate: Number(document.getElementById("mut").value),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Solver failed.");
      await animate(data);
    } catch (err) {
      showError(err.message);
    } finally {
      solving = false;
      solveBtn.disabled = false;
      solveBtn.textContent = "Evolve route";
      document.getElementById("hint").textContent = "Click to drop a city, or scatter a batch.";
    }
  });

  // Walk through the snapshots so the route visibly untangles.
  function animate(data) {
    return new Promise((resolve) => {
      const snaps = data.snapshots;
      const distOut = document.getElementById("distOut");
      const genOut  = document.getElementById("genOut");
      let i = 0;
      const step = () => {
        const s = snaps[i];
        bestTour = s.tour;
        distOut.textContent = s.distance.toFixed(1);
        genOut.textContent  = s.generation;
        drawBoard();
        drawPlot(data.history, Math.max(2, Math.round(
          (s.generation / data.history.length) * data.history.length)));
        i++;
        if (i < snaps.length) {
          reduceMotion ? step() : setTimeout(step, 45);
        } else {
          bestTour = data.bestTour;
          distOut.textContent = data.bestDistance.toFixed(1);
          genOut.textContent  = data.history.length;
          drawBoard(); drawPlot(data.history);
          resolve();
        }
      };
      step();
    });
  }

  window.addEventListener("resize", () => { drawBoard(); });
  drawBoard();
})();
</script>
</body>
</html>
